{% extends 'base.html' %}
{% load django_tables2 %}
{% load static %}

{% block content %}
<div class="p-3">
  <div class="container">
    <div class="row mt-3">
      <div class="col-12">
        <h2>Candidate Pool</h2>
        <hr />

        <form method="GET" action="" class="row g-2 mb-3 align-items-end">
          <div class="col-auto">
            <div class="input-group input-group-sm">
              <span class="input-group-text">Name</span>
              <input
                type="text"
                class="form-control"
                name="search"
                value="{{ request.GET.search }}"
                placeholder="Search candidates"
              >
            </div>
          </div>

          <div class="col-auto">
            <div class="input-group input-group-sm">
              <span class="input-group-text">Skills</span>
              <select
                name="skills"
                class="form-select form-select-sm"
                onchange="this.form.submit()"
              >
                <option value="">All Skills</option>
                {% for skill in template_data.skills %}
                  <option
                    value="{{ skill.name }}"
                    {% if request.GET.skills == skill.name %}selected{% endif %}
                  >
                    {{ skill.name }}
                  </option>
                {% endfor %}
              </select>
            </div>
          </div>

          <div class="col-auto">
            <div class="input-group input-group-sm">
              <span class="input-group-text">Sort by</span>
              <select
                name="sort"
                class="form-select form-select-sm"
                onchange="this.form.submit()"
              >
                <option value="user__first_name"
                        {% if request.GET.sort == "user__first_name" or not request.GET.sort %}
                          selected
                        {% endif %}
                >
                  Name (A–Z)
                </option>
                <option value="-user__first_name"
                        {% if request.GET.sort == "-user__first_name" %}selected{% endif %}
                >
                  Name (Z–A)
                </option>
              </select>
            </div>
          </div>
          <div class="col-auto">
            <div class="input-group input-group-sm">
              <span class="input-group-text">Location</span>
              <select
                name="distance"
                class="form-select form-select-sm"
                onchange="this.form.submit()"
              >
                <option value="10"
                        {% if request.GET.distance == "10"  %}
                          selected
                        {% endif %}
                >
                  Within 10 miles
                </option>
                <option value="30"
                        {% if request.GET.distance == "30" %}selected{% endif %}
                >
                  Within 30 miles
                </option>
                <option value="50"
                        {% if request.GET.distance == "50" %}selected{% endif %}
                >
                  Within 50 miles
                </option>
                <option value="100"
                        {% if request.GET.distance == "100" %}selected{% endif %}
                >
                  Within 100 miles
                </option>
                <option value="worldwide"
                        {% if request.GET.distance == "worldwide" or not request.GET.distance %}selected{% endif %}
                >
                Worldwide
                </option>
              </select>
            </div>
          </div>
        </form>
        <a href="">
          <button>
          </button>
        </a>

        <hr />

        {% if template_data.table_data %}
          {% render_table template_data.table_data %}
        {% else %}
          <p>No candidates match your filters.</p>
        {% endif %}
      </div>
    </div>
  </div>
</div>
{% endblock content %}
